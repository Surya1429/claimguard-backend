spring.application.name=claimguard-backend

# Show what Spring Security does for every request (learning only)
logging.level.org.springframework.security=TRACE


# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/claimguard
spring.datasource.username=claimguard
spring.datasource.password=claimguard123

# ---------- JPA / Hibernate ----------
# update = create/alter tables from entities (OK for learning, NOT for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


